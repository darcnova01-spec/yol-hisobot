<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yo'l Qurilish Hisoboti</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 450px; background: white; padding: 20px; border-radius: 12px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2, h3 { text-align: center; color: #1e293b; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; color: #475569; }
    input, textarea, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; font-weight: bold; margin-top: 15px; cursor: pointer; }
    button:hover { background: #0369a1; }
    .hidden { display: none; }
    .error { color: #dc2626; font-size: 14px; text-align: center; margin-top: 10px; }
    .logout-btn { background: #ef4444; margin-top: 20px; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- LOGIN QISMI -->
  <div id="loginSection">
    <h2>Yo'l Qurilish Hisoboti</h2>
    <form id="loginForm">
      <label>Login</label>
      <input type="text" id="username" required>
      
      <label>Parol</label>
      <input type="password" id="password" required>
      
      <button type="submit">Kirish</button>
      <div id="loginError" class="error hidden"></div>
    </form>
  </div>

  <!-- ASOSIY APPLIKATSIYA QISMI -->
  <div id="appSection" class="hidden">
    <h3 id="userGreeting"></h3>

    <!-- RAHBAR FORMASI -->
    <div id="rahbarFormContainer" class="hidden">
      <h3>Moliya va Pul Ajratish</h3>
      <form id="rahbarForm">
        <label>Qabul qiluvchi xodim (Login / Ismi):</label>
        <input type="text" id="recipientUser" placeholder="masalan: zavxoz, prorab..." required>

        <label>Yuborilayotgan summa (so'm):</label>
        <input type="number" id="sendAmount" placeholder="masalan: 5000000" required>

        <label>Maqsadi / Izoh:</label>
        <textarea id="sendNote" placeholder="Yo'l ta'mirlash ishlariga..."></textarea>

        <button type="submit">Pulni Yuborish</button>
      </form>
    </div>

    <!-- PRORAB FORMASI -->
    <div id="prorabFormContainer" class="hidden">
      <h3>Prorab Hisoboti</h3>
      <form id="prorabForm">
        <label>Bajarilgan ishlar:</label>
        <textarea id="prorabWork" required></textarea>
        <label>Xarajatlar (so'm):</label>
        <input type="number" id="prorabExpenses">
        <label>Xarajat izohi:</label>
        <input type="text" id="prorabExpenseNote">
        <label>Ishchilar davomati:</label>
        <input type="text" id="prorabAttendance">
        <button type="submit">Hisobotni saqlash</button>
      </form>
    </div>

    <!-- SHAFYOR FORMASI -->
    <div id="shafyorFormContainer" class="hidden">
      <h3>Shafyor Hisoboti</h3>
      <form id="shafyorForm">
        <label>Moshina raqami / Rusumi:</label>
        <input type="text" id="shafyorVehicle" required>
        <label>Bosilgan masofa (km):</label>
        <input type="number" id="shafyorMileage">
        <label>Qatnovlar soni (Reys):</label>
        <input type="number" id="shafyorTrips">
        <label>Ta'mir xarajati (so'm):</label>
        <input type="number" id="shafyorRepairCost">
        <button type="submit">Hisobotni saqlash</button>
      </form>
    </div>

    <!-- TAMINOTCHI (ZAVXOZ) FORMASI -->
    <div id="taminotchiFormContainer" class="hidden">
      <h3>Ta'minotchi / Zavxoz Hisoboti</h3>
      <form id="taminotchiForm">
        <label>Oziq-ovqat xarajati (so'm):</label>
        <input type="number" id="taminotchiFood">
        <label>Yonilg'i xarajatlari izohi:</label>
        <textarea id="taminotchiFuel"></textarea>
        <button type="submit">Hisobotni saqlash</button>
      </form>
    </div>

    <button id="logoutBtn" class="logout-btn">Chiqish</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
